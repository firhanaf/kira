version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kira_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kira
      POSTGRES_PASSWORD: kira_secret
      POSTGRES_DB: kira_db
    ports:
      - "5432:5432"
    volumes:
      - kira_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kira -d kira_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Uncomment for production-like setup
  # redis:
  #   image: redis:7-alpine
  #   container_name: kira_redis
  #   ports:
  #     - "6379:6379"

volumes:
  kira_pgdata:
